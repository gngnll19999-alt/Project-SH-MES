<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>성과분석 리포트 · SH-MES</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="analysis" data-title="성과분석 리포트" data-crumb="M-09 / 추적 · 분석">

<div class="filters">
  <label>기간</label>
  <input type="date" id="f-from"> <span class="dim">~</span> <input type="date" id="f-to">
  <label>집계 기준</label>
  <select id="f-by"><option>라인별</option><option>품목별</option><option>작업조별</option></select>
  <button class="btn pri" id="btn-go">조회</button>
  <div style="flex:1"></div>
  <button class="btn" id="btn-xls">엑셀 내보내기</button>
  <button class="btn" id="btn-print">보고서 인쇄</button>
</div>

<div class="grid g5" style="margin-bottom:12px" id="kpi"></div>

<div class="grid g2" style="margin-bottom:12px">
  <div class="card">
    <header>
      <h2>일별 생산량 · 불량률 추이</h2><span class="sub">최근 14일</span>
      <div class="spacer"></div>
      <div class="legend"><span><i style="background:#00a9a5"></i>생산량</span><span><i style="background:#e5544b"></i>불량률</span></div>
    </header>
    <div class="body"><div id="ch-1"></div><div style="margin-top:8px"><div id="ch-2"></div></div></div>
  </div>

  <div class="card">
    <header><h2>OEE 구성요소 추이</h2><span class="sub">최근 14일 · A / P / Q</span></header>
    <div class="body"><div id="ch-3"></div>
      <div class="note">9월 12일 성능가동률 급락은 CT-02 건조로 온도 이상에 따른 감속 운전이 원인입니다. 9월 14일 필터 교체 후 회복되었습니다.</div>
    </div>
  </div>
</div>

<div class="grid" style="grid-template-columns:1fr 340px;margin-bottom:12px">
  <div class="card">
    <header><h2 id="tb-title">라인별 생산 실적</h2><span class="sub">기간 누계</span></header>
    <div class="body tight">
      <table class="tb">
        <thead>
          <tr><th id="h1">라인</th><th class="num">계획</th><th class="num">실적</th><th class="num">달성률</th>
            <th class="num">양품</th><th class="num">불량</th><th class="num">불량률</th><th class="num">OEE</th><th>추이</th></tr>
        </thead>
        <tbody id="tb"></tbody>
        <tfoot><tr id="tf" style="background:var(--panel-2);font-weight:700"></tr></tfoot>
      </table>
    </div>
  </div>

  <div class="card">
    <header><h2>불량 원인 분류</h2><span class="sub">4M 기준</span></header>
    <div class="body">
      <div id="ch-4" style="display:flex;justify-content:center"></div>
      <table class="tb" style="margin-top:8px" id="tb-4m"></table>
    </div>
  </div>
</div>

<div class="card">
  <header><h2>개선 과제 현황</h2><span class="sub">주간 생산회의 등록 건</span></header>
  <div class="body tight">
    <table class="tb">
      <thead><tr><th style="width:110px">과제번호</th><th>내용</th><th style="width:90px">대상</th><th style="width:80px">담당</th><th style="width:100px">목표일</th><th style="width:70px">상태</th><th style="width:150px">기대효과</th></tr></thead>
      <tbody id="tb-imp"></tbody>
    </table>
  </div>
</div>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/mock.js"></script>
<script src="../assets/js/chart.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  var to = new Date(), from = new Date(to.getTime() - 13 * 86400000);
  function ymd(d) { return d.toISOString().slice(0, 10); }
  document.getElementById('f-from').value = ymd(from);
  document.getElementById('f-to').value = ymd(to);

  // ---- 14일 데이터 (시연용 고정 패턴) ----
  var days = [], prod = [], defr = [], A = [], P = [], Q = [];
  var pBase = [16800, 17200, 16100, 17900, 18200, 9400, 0, 17400, 17800, 16900, 18100, 15200, 17600, 18400];
  var dBase = [1.31, 1.18, 1.62, 1.24, 1.09, 1.44, 0, 1.27, 1.15, 1.38, 1.21, 1.88, 1.42, 1.33];
  var pf    = [91.2, 92.4, 88.1, 93.0, 93.8, 86.5, 0, 92.1, 93.4, 90.2, 93.1, 74.6, 88.9, 92.8];
  for (var i = 0; i < 14; i++) {
    var d = new Date(from.getTime() + i * 86400000);
    days.push((d.getMonth() + 1) + '/' + d.getDate());
    prod.push(pBase[i]);
    defr.push(dBase[i]);
    A.push(+(86 + (i % 5) * 1.4 - (i === 11 ? 6 : 0)).toFixed(1));
    P.push(pf[i] || 0);
    Q.push(+(100 - dBase[i]).toFixed(1));
  }

  Chart.line(document.getElementById('ch-1'), {
    labels: days, h: 150, area: true,
    series: [{ name: '생산량', color: '#00a9a5', data: prod, dots: true }]
  });
  Chart.line(document.getElementById('ch-2'), {
    labels: days, h: 96, min: 0, max: 2.4,
    series: [{ name: '불량률', color: '#e5544b', data: defr, dots: true }],
    refs: [{ v: 1.2, color: '#e0a83a', label: '목표 1.20%' }]
  });
  Chart.line(document.getElementById('ch-3'), {
    labels: days, h: 258, min: 60, max: 102,
    series: [
      { name: 'A', color: '#00a9a5', data: A },
      { name: 'P', color: '#3d8bfd', data: P },
      { name: 'Q', color: '#46c46b', data: Q }
    ],
    refs: [{ v: 85, color: '#e0a83a', label: '목표 85%' }]
  });

  // ---- 집계 테이블 ----
  var eq = Mock.equipments();
  var BY = {
    '라인별': eq.map(function (e, i) {
      var plan = 18000 + i * 900, act = Math.round(plan * (0.9 + (i % 4) * 0.03));
      var bad = Math.round(act * (0.008 + (i % 5) * 0.004));
      return { k: e.code + ' ' + e.name, plan: plan, act: act, bad: bad, oee: e.oee, tr: e.trend };
    }),
    '품목별': Mock.ITEMS.map(function (it, i) {
      var plan = 24000 - i * 3200, act = Math.round(plan * (0.88 + i * 0.025));
      var bad = Math.round(act * (0.006 + i * 0.003));
      return { k: it.code + ' ' + it.name, plan: plan, act: act, bad: bad, oee: 78 + i * 2.4, tr: eq[i].trend };
    }),
    '작업조별': [
      { k: 'A조 (주간)', plan: 76000, act: 71800, bad: 890,  oee: 84.2, tr: eq[0].trend },
      { k: 'B조 (야간)', plan: 76000, act: 66400, bad: 1240, oee: 78.6, tr: eq[1].trend },
      { k: 'C조 (교대)', plan: 38000, act: 35100, bad: 470,  oee: 82.1, tr: eq[2].trend }
    ]
  };

  function renderTable() {
    var by = document.getElementById('f-by').value;
    var rows = BY[by];
    document.getElementById('tb-title').textContent = by.replace('별', '별 ') + '생산 실적';
    document.getElementById('h1').textContent = by.replace('별', '');

    document.getElementById('tb').innerHTML = rows.map(function (r, i) {
      var rate = r.act / r.plan * 100, br = r.bad / r.act * 100;
      return '<tr><td><b>' + r.k + '</b></td>' +
        '<td class="num">' + r.plan.toLocaleString() + '</td>' +
        '<td class="num">' + r.act.toLocaleString() + '</td>' +
        '<td class="num" style="color:' + (rate >= 95 ? 'var(--ok)' : rate >= 88 ? 'inherit' : 'var(--bad)') + '">' + rate.toFixed(1) + '%</td>' +
        '<td class="num">' + (r.act - r.bad).toLocaleString() + '</td>' +
        '<td class="num">' + r.bad.toLocaleString() + '</td>' +
        '<td class="num" style="color:' + (br > 1.2 ? 'var(--bad)' : 'var(--ok)') + '">' + br.toFixed(2) + '%</td>' +
        '<td class="num">' + r.oee.toFixed(1) + '</td>' +
        '<td><span class="sp' + i + '"></span></td></tr>';
    }).join('');
    rows.forEach(function (r, i) {
      Chart.spark(document.querySelector('.sp' + i), r.tr, r.oee >= 85 ? '#46c46b' : '#e0a83a');
    });

    var tp = rows.reduce(function (a, r) { return a + r.plan; }, 0);
    var ta = rows.reduce(function (a, r) { return a + r.act; }, 0);
    var tb = rows.reduce(function (a, r) { return a + r.bad; }, 0);
    document.getElementById('tf').innerHTML =
      '<td>합계</td><td class="num">' + tp.toLocaleString() + '</td><td class="num">' + ta.toLocaleString() + '</td>' +
      '<td class="num">' + (ta / tp * 100).toFixed(1) + '%</td>' +
      '<td class="num">' + (ta - tb).toLocaleString() + '</td><td class="num">' + tb.toLocaleString() + '</td>' +
      '<td class="num">' + (tb / ta * 100).toFixed(2) + '%</td><td class="num">-</td><td></td>';
  }
  document.getElementById('f-by').onchange = renderTable;
  renderTable();

  // ---- KPI ----
  var totProd = prod.reduce(function (a, b) { return a + b; }, 0);
  var avgDef = defr.filter(function (v) { return v > 0; }).reduce(function (a, b) { return a + b; }, 0) / 13;
  var avgOee = A.map(function (a, i) { return a * P[i] * Q[i] / 10000; })
                .filter(function (v) { return v > 0; });
  var oeeAvg = avgOee.reduce(function (a, b) { return a + b; }, 0) / avgOee.length;

  document.getElementById('kpi').innerHTML = [
    { l: '기간 생산량', v: totProd.toLocaleString(), u: 'EA', s: '14일 누계', c: '' },
    { l: '평균 달성률', v: '93.4', u: '%', s: '전월 대비 +1.8%p', c: 'k-warn' },
    { l: '평균 불량률', v: avgDef.toFixed(2), u: '%', s: '목표 1.20% 초과', c: 'k-bad' },
    { l: '평균 OEE', v: oeeAvg.toFixed(1), u: '%', s: '목표 85.0%', c: oeeAvg >= 85 ? 'k-ok' : 'k-warn' },
    { l: '총 손실시간', v: '788', u: '분', s: '6대 로스 합계', c: '' }
  ].map(function (k) {
    return '<div class="kpi ' + k.c + '"><div class="bar"></div><div class="lbl">' + k.l + '</div>' +
      '<div class="val">' + k.v + '<small>' + k.u + '</small></div><div class="dlt dim">' + k.s + '</div></div>';
  }).join('');

  // ---- 4M 원인 ----
  var M4 = [
    { n: 'Machine (설비)', v: 184, c: '#e5544b' },
    { n: 'Material (자재)', v: 121, c: '#e0a83a' },
    { n: 'Method (방법)',   v: 89,  c: '#00a9a5' },
    { n: 'Man (작업자)',    v: 65,  c: '#3d8bfd' }
  ];
  Chart.donut(document.getElementById('ch-4'), M4.map(function (m) { return { value: m.v, color: m.c }; }), {
    size: 156, center: '459', centerSub: '총 불량건수'
  });
  var tot4 = M4.reduce(function (a, m) { return a + m.v; }, 0);
  document.getElementById('tb-4m').innerHTML = M4.map(function (m) {
    return '<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + m.c + ';margin-right:6px"></i>' +
      m.n + '</td><td class="num">' + m.v + '</td><td class="num dim">' + (m.v / tot4 * 100).toFixed(1) + '%</td></tr>';
  }).join('');

  // ---- 개선과제 ----
  var IMP = [
    { no: 'IMP-26-041', c: 'CT-02 건조로 필터 교체주기 단축 (월 1회 → 격주)', t: 'CT-02', o: '박성진', d: '2026-10-10', s: '진행', e: '성능가동률 +4.2%p' },
    { no: 'IMP-26-040', c: '품목 변경 셋업 표준화 및 지그 상시 장착', t: 'AS-01/02', o: '최민호', d: '2026-10-24', s: '진행', e: '셋업시간 -35분/회' },
    { no: 'IMP-26-039', c: '코팅 두께 자동 보정 로직 적용', t: 'CT-01', o: '이지혜', d: '2026-11-07', s: '검토', e: '불량률 -0.3%p' },
    { no: 'IMP-26-037', c: '배합 원료 칭량 오차 저감 (로드셀 교정)', t: 'MIX-01/02', o: '한지원', d: '2026-09-30', s: '완료', e: '점도 편차 -22%' },
    { no: 'IMP-26-035', c: '야간조 초기수율 개선 교육', t: 'B조', o: '류경민', d: '2026-09-19', s: '완료', e: '초기수율 로스 -18분' }
  ];
  document.getElementById('tb-imp').innerHTML = IMP.map(function (r) {
    var c = r.s === '완료' ? 'st-done' : r.s === '진행' ? 'st-run' : 'st-idle';
    return '<tr><td class="lot">' + r.no + '</td><td>' + r.c + '</td><td>' + r.t + '</td>' +
      '<td>' + r.o + '</td><td>' + r.d + '</td>' +
      '<td><span class="st ' + c + '">' + r.s + '</span></td><td class="dim">' + r.e + '</td></tr>';
  }).join('');

  document.getElementById('btn-xls').onclick = function () {
    alert('엑셀 내보내기\n\n대상 : ' + document.getElementById('f-by').value + ' 집계표\n기간 : ' +
      document.getElementById('f-from').value + ' ~ ' + document.getElementById('f-to').value +
      '\n형식 : .xlsx (경영회의 보고 양식)');
  };
  document.getElementById('btn-print').onclick = function () { window.print(); };
  document.getElementById('btn-go').onclick = renderTable;
})();
</script>
</body>
</html>
